<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simple-magpie · 上下文窗口</title>
<style>
  :root{
    --bg:#1b1d21; --panel:#24262b; --panel2:#2b2e34; --line:#34373e; --fg:#e6e8eb;
    --muted:#8b909a; --dim:#5f636d;
    --system:#3b82f6; --tools:#2563eb; --memory:#e0a72f; --files:#3f9d5a;
    --results:#c2703a; --chat:#9b6fd1; --free:#303238;
    --ok:#37c26a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:22px}
  .head{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .src{color:var(--muted);font-size:13px}
  .badge{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
  .badge.ok{color:var(--ok);border-color:#2c5a3f}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px}
  .metric .lab{color:var(--muted);font-size:13px}
  .metric .big{font-size:30px;font-weight:650;letter-spacing:.3px}
  .metric .big .unit{font-size:16px;color:var(--muted);font-weight:400}
  .metric .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .bar{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-top:8px}
  .bar > i{display:block;height:100%;border-radius:5px}
  .cache-bar > i{background:linear-gradient(90deg,#2f9e5a,#46d07a)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:12px;
    border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--muted)}
  .legend .k{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;
    padding:5px 12px;font-size:12.5px;cursor:pointer}
  .tab.on{color:var(--fg);border-color:#4a4e57;background:#30343b}
  table{width:100%;border-collapse:collapse;margin-top:12px}
  td{padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  td.n{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
  td.v{text-align:right;color:var(--muted);width:70px;font-variant-numeric:tabular-nums}
  .bar2{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;min-width:120px}
  .bar2 > i{display:block;height:100%}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .tile:hover{opacity:.85;cursor:default}
  .empty{color:var(--muted);padding:30px;text-align:center}
  .foot{color:var(--dim);font-size:12px;margin-top:10px}
  code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12px}
  /* conversation view */
  .conv{display:none;margin-top:12px}
  .conv.on{display:block}
  .conv-head{display:flex;align-items:center;gap:8px;padding:9px 12px;margin-bottom:10px;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--muted)}
  .conv-head .ch-dot{width:8px;height:8px;border-radius:50%;background:#3f9d5a}
  .conv-head .ch-agent{color:#e6e8eb;font-weight:600}
  .conv-head .ch-model{color:#9aa0aa}
  .conv-head .ch-sep{color:#4a4e57}
  .conv-head .ch-sess b{color:#e6e8eb;font-weight:600}
  .conv-head .ch-meta{color:var(--muted)}
  .msg{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .msg .who{font-size:12px;font-weight:600;color:var(--muted);padding-top:2px}
  .msg.user .who{color:#5aa9ff}
  .msg.assistant .who{color:#c69bf0}
  .msg.system .who{color:#8b909a}
  .msg.tool .who{color:#e0a72f}
  .bubble{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.5;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}
  .msg.user .bubble{background:#1e2a3a;border-color:#2b3f57}
  .msg.assistant .bubble{background:#2a2236;border-color:#3c2f50}
  .msg.system .bubble{background:#22242a;color:#9298a2}
  .tool-call{border-color:#5a4326!important;background:#2a2319!important}
  .tool-call .hd{color:#e0a72f;font-weight:600;font-size:12.5px;margin-bottom:4px}
  .tool-call pre{margin:0;white-space:pre-wrap;word-break:break-word;color:#d8c39a;font-size:12px}
  .tool-result .hd{color:#c2703a;font-weight:600;font-size:12.5px;margin-bottom:4px}
  .badge-trunc{color:#e0a72f;font-size:11px;margin-left:6px}
  .thinking .bubble{background:#1f2228;color:#9aa0aa;font-style:italic}
  .sel{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;
    padding:4px 8px;font-size:12.5px;max-width:340px;cursor:pointer}
  /* date groups */
  .day{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:var(--muted);font-size:12px}
  .day:first-child{margin-top:6px}
  .day .line{flex:1;height:1px;background:var(--line)}
  .day .d{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  /* collapsible message */
  .msg .bubble{position:relative;transition:max-height .12s ease}
  .msg.collapsed .bubble{max-height:132px;overflow:hidden}
  .msg.collapsed .bubble::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;
    background:linear-gradient(transparent,var(--panel2));pointer-events:none;border-radius:0 0 10px 10px}
  .msg.user.collapsed .bubble::after{background:linear-gradient(transparent,#1e2a3a)}
  .msg.assistant.collapsed .bubble::after{background:linear-gradient(transparent,#2a2236)}
  .msg-tools{display:flex;gap:8px;margin-top:6px}
  .msg-tools button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer}
  .msg-tools button:hover{color:var(--fg)}
  .msg.hidden-role{display:none}
  /* per-turn conversation (magpie style) */
  .turn{border-bottom:1px solid var(--line)}
  .turn-hd{display:flex;align-items:center;gap:10px;padding:12px 4px;cursor:pointer;user-select:none;font-size:13px}
  .turn-hd:hover{background:var(--panel2);border-radius:8px}
  .turn .chev{color:var(--muted);width:12px}
  .turn-t{font-weight:600}
  .turn-time{color:var(--dim);font-size:11.5px}
  .turn-tok{color:var(--muted);font-variant-numeric:tabular-nums}
  .turn-body{padding:4px 0 16px 22px}
  .it{margin:10px 0}
  .it-hd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .it-lab{font-size:11.5px;color:var(--muted)}
  .it-user .it-lab{color:#5aa9ff}
  .it-assistant .it-lab{color:#c69bf0}
  .it-call .it-lab{color:#e0a72f}
  .it-result .it-lab{color:#c2703a}
  .it-think .it-lab{color:#9aa0aa;font-style:italic}
  .copy{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:6px;width:24px;height:22px;cursor:pointer;font-size:12px;line-height:1}
  .copy:hover{color:var(--fg);border-color:#4a4e57}
  .it-body{margin:0;white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.5;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",monospace;max-height:420px;overflow:auto}
  .it-user .it-body{background:#1e2a3a;border-color:#2b3f57}
  .it-assistant .it-body{background:#2a2236;border-color:#3c2f50}
  .it-call .it-body{background:#2a2319;border-color:#5a4326;color:#d8c39a}
  .it-result .it-body{color:#c9cdd4}
  .it-think .it-body{background:#1f2228;color:#9aa0aa;font-style:italic}
  .it-system .it-body{background:#22242a;color:#9298a2}
  /* clickable rows + treemap tiles */
  tr.row{cursor:pointer}
  tr.row:hover{background:var(--panel2)}
  .tile.clickable{cursor:pointer}
  .tile.clickable:hover{opacity:.8}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;
    justify-content:center;padding:6vh 20px;z-index:50}
  .modal.on{display:flex}
  .modal-panel{width:min(900px,100%);max-height:86vh;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 18px 60px rgba(0,0,0,.5)}
  .modal-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .modal-hd strong{font-size:14px}
  .modal-sub{color:var(--muted);font-size:12px}
  .modal-hd button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    border-radius:7px;padding:4px 9px;cursor:pointer;font-size:13px}
  .modal-hd button:hover{color:var(--fg);border-color:#4a4e57}
  .modal-body{margin:0;padding:16px 18px;overflow:auto;font:13px/1.7 "PingFang SC","Microsoft YaHei",ui-monospace,SFMono-Regular,Menlo,monospace;color:#d6dae0}
  .modal-body.nowrap{white-space:pre;overflow:auto}
  .modal-body.wrap{white-space:pre-wrap;word-break:break-word}
  /* bracketed structure (tool descriptions often have <...> sections) */
  .v-sec{color:#e0a72f;font-weight:600;margin:14px 0 4px}
  .v-sec:first-child{margin-top:0}
  .v-bullet{color:#9fb3c8;padding-left:8px}
  .v-key{color:#7fc6ff}
  .v-str{color:#a6e3a1}
  .v-num{color:#f2b880}
  .v-nil{color:#c98bd6}
  .v-dim{color:#7d828b}
  .v-line{display:flex}
  .v-ln{color:#4a4e57;user-select:none;text-align:right;padding-right:12px;flex:0 0 auto}
  .v-code{flex:1;white-space:inherit}
  .modal-body.filetxt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .modal-body.prose{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13.5px;line-height:1.75}
  .modal-foot{padding:9px 18px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}
  .pi-list{display:flex;flex-direction:column;font-family:inherit}
  .pi-row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
  .pi-row:hover{background:var(--panel2)}
  .pi-row .pi-n{flex:1;color:var(--fg);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pi-row .pi-t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="row">
      <strong>上下文窗口</strong>
      <span id="src" class="src"></span>
      <select id="sessionsel" class="sel" title="切换会话"></select>
      <span style="flex:1"></span>
      <span id="health" class="badge">已计数</span>
      <span id="counted" class="badge">载入中…</span>
    </div>
    <div class="metrics">
      <div class="metric">
        <div class="lab">已用上下文</div>
        <div class="big"><span id="used">—</span> <span class="unit">/ <span id="window">—</span> token</span></div>
        <div class="sub" id="usedSub"></div>
      </div>
      <div class="metric">
        <div class="lab">提示词缓存</div>
        <div class="big"><span id="cachePct">—</span><span class="unit" id="cacheW"> 命中</span></div>
        <div class="bar cache-bar"><i id="cacheBar" style="width:0"></i></div>
        <div class="sub" id="cacheSub"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <svg id="treemap" viewBox="0 0 1100 260" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend" id="legend"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="tabs" id="viewtabs">
        <span class="tab on" data-v="parts">内容分类</span>
        <span class="tab" data-v="conv">对话内容</span>
      </div>
      <div class="tabs" id="tabs"></div>
    </div>
    <table><tbody id="rows"></tbody></table>
    <div id="conv" class="conv"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-panel">
    <div class="modal-hd">
      <span class="dot" id="modal-dot"></span>
      <strong id="modal-title">—</strong>
      <span class="modal-sub" id="modal-sub"></span>
      <span style="flex:1"></span>
      <button id="modal-wrap" title="切换自动换行">↩ 换行</button>
      <button id="modal-copy" title="复制">⧉</button>
      <button id="modal-close" title="关闭">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<script>
const PARTS = ["system","tools","memory","files","results","chat"];
const LABEL = {system:"系统提示词",tools:"工具",memory:"记忆",files:"文件",results:"工具结果",chat:"会话内容"};
const COLOR = {system:"#3b82f6",tools:"#2563eb",memory:"#e0a72f",files:"#3f9d5a",results:"#c2703a",chat:"#9b6fd1"};
const $ = (id)=>document.getElementById(id);
const fmtK = (n)=>{
  if(n==null) return "—";
  if(n>=1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,"")+"M";
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,"")+"K";
  return String(n);
};

let state = null, filter = "全部", view = (location.hash==="#conv"?"conv":"parts"), transcriptTurns = [], sessionTurns = [], openTurn = 0, selectedSession = "",
    lastTurnsSig = "", firstTurnOpenedFor = "", sessionsSig = "";

async function load(){
  // populate the session switcher once (and keep the selection)
  try {
    const sr = await fetch("/dashboard/sessions");
    const list = (await sr.json()).sessions || [];
    const sel = $("sessionsel");
    // signature of the session set + labels: rebuild whenever anything changes
    const sig = list.map(x => x.session + ":" + x.requests + ":" + (x.time||"")).join("|");
    if (list.length && sig !== sessionsSig) {
      sessionsSig = sig;
      sel.innerHTML = list.map(x =>
        `<option value="${esc(x.session)}">${esc(sessLabel(x))}</option>`).join("");
      // find the option for the current selection, else the first (most recent)
      if (selectedSession && list.some(x => x.session === selectedSession)) sel.value = selectedSession;
      else selectedSession = sel.value;
    }
    sel.onchange = () => { selectedSession = sel.value; view="conv"; renderViews(); load(); };
  } catch(e){}
  const url = selectedSession ? "/dashboard/session?session=" + encodeURIComponent(selectedSession) : "/dashboard/session";
  const r = await fetch(url);
  const s = await r.json();
  if(s.empty){
    $("src").textContent = "暂无记录 —— 让一个 Agent 通过本网关发一次请求";
    $("treemap").innerHTML = `<text x="20" y="40" fill="#8b909a">还没有请求。把 base_url 指向本网关试一次。</text>`;
    $("tabs").innerHTML = ""; $("rows").innerHTML = "";
    return;
  }
  state = s;
  if (!selectedSession) selectedSession = s.session;
  // fetch the conversation for the same session, as per-turn items
  try {
    const tr = await fetch("/dashboard/turns?session=" + encodeURIComponent(s.session||""));
    sessionTurns = (await tr.json()).turns || [];
    // default-open the first turn only the first time we see this session,
    // so a poll never resets what the user opened / scrolled to
    if(sessionTurns.length && firstTurnOpenedFor !== s.session){
      openTurn = sessionTurns[0].index;
      firstTurnOpenedFor = s.session;
    }
  } catch(e){ sessionTurns = []; }
  renderHead(s); renderTree(s); renderLegend(s); renderTabs(s); renderViews();
}

function renderHead(s){
  const used = s.prompt.tokens, win = s.window || 200000;
  $("used").textContent = fmtK(used);
  $("window").textContent = fmtK(win);
  const pct = win>0 ? (used/win*100) : 0;
  const free = Math.max(0, win-used);
  $("usedSub").textContent = `已用 ${pct.toFixed(pct<10?1:0)}% · 约还能容纳 ${s.headroom>=999?"很多":s.headroom} 个请求`;
  $("src").innerHTML = `${esc(s.agent||"?")} · <span style="color:#9aa0aa">${esc(s.model||"")}</span>`;
  $("counted").textContent = `${s.turns} 轮 · ${s.requests} 请求`;
  $("health").textContent = s.prompt.counted ? "已计数" : "估算";
  $("health").className = "badge" + (s.prompt.counted ? " ok" : "");

  const u = s.usage || {};
  const total = (u.Input||0)+(u.CacheRead||0)+(u.CacheWrite||0);
  const hit = total>0 ? (u.CacheRead/total*100) : 0;
  $("cachePct").textContent = (total>0 ? hit.toFixed(0) : "—") + (total>0?"%":"");
  $("cacheBar").style.width = (total>0? hit:0) + "%";
  $("cacheSub").textContent = total>0
    ? `${fmtK(u.CacheRead)} 来自缓存 · ${fmtK(u.Input)} 新增`
    : "厂商未报告缓存";
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// ---- squarified treemap ----
function squarify(items, x, y, w, h){
  const out = [];
  const total = items.reduce((s,a)=>s+a.v,0) || 1;
  let rest = items.slice(), cx=x, cy=y, cw=w, ch=h, rem=total;
  while(rest.length){
    const row=[];
    const side = Math.min(cw,ch);
    let best=Infinity;
    while(rest.length){
      const cand = row.concat(rest[0]);
      const worst = worstRatio(cand, side, rem, cw*ch);
      if(worst<=best){ row.push(rest.shift()); best=worst; } else break;
    }
    // lay row along the shorter side
    const rowSum = row.reduce((s,a)=>s+a.v,0);
    const frac = rowSum/rem;
    if(cw>=ch){
      const rw = frac*cw;
      let oy=cy;
      for(const it of row){ const rh=(it.v/rowSum)*ch; out.push({a:it,x:cx,y:oy,w:rw,h:rh}); oy+=rh; }
      cx+=rw; cw-=rw;
    } else {
      const rh = frac*ch;
      let ox=cx;
      for(const it of row){ const rw=(it.v/rowSum)*cw; out.push({a:it,x:ox,y:cy,w:rw,h:rh}); ox+=rw; }
      cy+=rh; ch-=rh;
    }
    rem-=rowSum;
    if(rem<=0) break;
  }
  return out;
}
function worstRatio(row, side, rem, area){
  const s = row.reduce((a,b)=>a+b.v,0);
  if(s<=0||side<=0) return Infinity;
  const r = s/rem*area, rw = r/side, rh = s/ rw;
  let worst=0;
  for(const it of row){
    const a = (it.v/s)*r, w2 = side, h2 = a/w2;
    worst=Math.max(worst, Math.max(w2/h2, h2/w2));
  }
  return worst;
}

function renderTree(s){
  const W=1100,H=260, p=s.prompt, win=s.window||200000;
  const scale = Math.max(win, p.tokens, 1);
  // used share on a gentle curve so small slices stay visible
  const usedFrac = p.tokens<scale ? Math.max(Math.pow(p.tokens/scale,0.35), 0.04) : 1;
  const usedW = Math.round(W*usedFrac);
  const svg = $("treemap");
  let defs = `<defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#2a2c31"/><line x1="0" y1="0" x2="0" y2="8" stroke="#33363c" stroke-width="3"/></pattern></defs>`;
  let el = defs;

  const parts = PARTS.map(k=>p.parts.find(x=>x.kind===k)).filter(x=>x&&x.tokens>0);
  const items = parts.map(x=>({v:x.tokens,kind:x.kind,part:x}));
  const laid = squarify(items, 0,0, usedW, H);
  for(const q of laid){
    const r = q.a, x=q.x, y=q.y, w=q.w, h=q.h;
    const col = COLOR[r.kind]||"#555";
    el += `<g class="tile clickable" data-kind="${r.kind}"><rect x="${x+1}" y="${y+1}" width="${Math.max(0,w-2)}" height="${Math.max(0,h-2)}" rx="3" fill="${col}22" stroke="${col}" stroke-opacity=".5"/>`;
    // inner items
    const its = (r.part.items||[]).slice().sort((a,b)=>b.tokens-a.tokens);
    if(its.length && w>70 && h>44){
      const iv = its.map(it=>({v:it.tokens,it}));
      const sub = squarify(iv, x+1, y+1, Math.max(0,w-2), Math.max(0,h-2));
      for(const ss of sub){
        const sw=ss.w, sh=ss.h, sx=ss.x, sy=ss.y;
        if(sw<26||sh<18) continue;
        el += `<rect x="${sx+0.5}" y="${sy+0.5}" width="${Math.max(0,sw-1)}" height="${Math.max(0,sh-1)}" rx="2" fill="${col}3a"/>`;
      }
    }
    if(w>54 && h>26){
      const name = partTitle(r.part, r.kind);
      const tok = fmtK(r.part.tokens);
      el += `<text x="${x+7}" y="${y+16}" fill="#dfe3e8" font-size="11.5" font-weight="600">${esc(tok)} · ${esc(LABEL[r.kind])}</text>`;
      el += `<text x="${x+7}" y="${y+30}" fill="#a9aeb7" font-size="10.5">${esc(name)}</text>`;
    }
    el += `</g>`;
  }
  // free space
  if(p.tokens<scale && usedW<W){
    el += `<rect x="${usedW}" y="0" width="${W-usedW}" height="${H}" fill="url(#hatch)"/>`;
    const free=scale-p.tokens;
    el += `<text x="${usedW+14}" y="22" fill="#8b909a" font-size="12">剩余空间 ${fmtK(free)} · ${(free/scale*100).toFixed(1)}%</text>`;
  }
  svg.innerHTML = el;
  svg.querySelectorAll(".tile.clickable").forEach(g=>{
    g.addEventListener("click", ()=>{ const k=g.getAttribute("data-kind"); openPart(state, k); });
  });
}

function partTitle(part, kind){
  if(!part.items||!part.items.length) return LABEL[kind];
  const top = part.items[0];
  return top.name + (top.n>1?` ×${top.n}`:"");
}

function renderLegend(s){
  const p = s.prompt, win=s.window||200000;
  const byKind = {}; p.parts.forEach(x=>byKind[x.kind]=x.tokens);
  let html = "";
  for(const k of PARTS){
    html += `<span class="k"><span class="sw" style="background:${COLOR[k]}"></span>${LABEL[k]} <span style="color:#c7ccd3">${fmtK(byKind[k]||0)}</span></span>`;
  }
  html += `<span class="k" style="margin-left:auto"><span class="sw" style="background:repeating-linear-gradient(45deg,#3a3d43,#3a3d43 2px,#2a2c31 2px,#2a2c31 4px)"></span>剩余空间 <span style="color:#c7ccd3">${fmtK(Math.max(0,win-p.tokens))}</span></span>`;
  $("legend").innerHTML = html;
}

function renderTabs(){
  const tabs = ["全部",...PARTS.map(k=>LABEL[k])];
  $("tabs").innerHTML = tabs.map(t=>`<span class="tab${t===filter?" on":""}" data-t="${t}">${t}</span>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(el=>{
    el.onclick=()=>{ filter=el.dataset.t; renderTabs(); renderRows(state); };
  });
}

function renderViews(){
  $("viewtabs").querySelectorAll(".tab").forEach(el=>{
    el.classList.toggle("on", el.dataset.v===view);
    el.onclick=()=>{ view=el.dataset.v; renderViews(); renderRows(state); };
  });
  const isConv = view==="conv";
  $("tabs").style.display = isConv ? "none" : "";
  document.querySelector("table").style.display = isConv ? "none" : "";
  $("conv").classList.toggle("on", isConv);
  if(isConv) renderConv();
  else renderRows(state);
}

const ROLE_NAME = {user:"用户", assistant:"助手", system:"系统", tool:"工具"};
function dayOf(iso){
  if(!iso) return "未知日期";
  const d = new Date(iso);
  if(isNaN(d)) return "未知日期";
  const today = new Date();
  const ymd = (x)=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if(ymd(d)===ymd(today)) return "今天 · "+ymd(d);
  const y = new Date(today); y.setDate(y.getDate()-1);
  if(ymd(d)===ymd(y)) return "昨天 · "+ymd(d);
  return ymd(d);
}
function hhmm(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return "";
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
// shortId is a readable tail of a session id (UUIDs are long and identical-looking)
function shortId(id){
  if(!id) return "(无会话)";
  if(id.length<=16) return id;
  return "…"+id.slice(-8);
}
function sessLabel(x){
  const t = x.time ? hhmm(x.time) : "";
  return `${x.agent||"?"} · ${shortId(x.session)} · ${x.requests}请求${t?" · "+t:""}`;
}
function prettyJSON(s){
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch(e){ return s || ""; }
}

// itemHtml is one block of a turn, as magpie shows it: a muted role label, the
// content, and a copy button. type drives the label and colour.
function itemHtml(t){
  let label, cls, body;
  if(t.kind==="tool_call"){ label = "工具调用 " + (t.name||""); cls="it-call"; body = prettyJSON(t.args); }
  else if(t.kind==="tool_result"){ label = "工具结果"; cls="it-result"; body = t.text || ""; }
  else if(t.kind==="thinking"){ label = "思考"; cls="it-think"; body = t.text || ""; }
  else if(t.role==="user"){ label = "你"; cls="it-user"; body = t.text || ""; }
  else if(t.role==="system"){ label = "系统"; cls="it-system"; body = t.text || ""; }
  else { label = "助手"; cls="it-assistant"; body = t.text || ""; }
  const trunc = t.trunc ? '<span class="badge-trunc">(已截断)</span>' : "";
  return `<div class="it ${cls}">
    <div class="it-hd"><span class="it-lab">${esc(label)}</span>
      <button class="copy" title="复制" data-copy="${esc(body).replace(/"/g,"&quot;")}">⧉</button></div>
    <pre class="it-body">${esc(body)}${trunc}</pre></div>`;
}

function renderConv(){
  const el = $("conv");
  if(!sessionTurns.length){ el.innerHTML = `<div class="empty">没有对话内容</div>`; $("foot").textContent=""; return; }
  // skip rebuilding when nothing changed (the 4s poll) so scrolling and the
  // open turn are preserved instead of jumping back to the top
  const sig = openTurn + "|" + sessionTurns.map(t => t.index + ":" + t.tokens + ":" + (t.items ? t.items.length : 0)).join(",");
  if(sig === lastTurnsSig && el.classList.contains("drawn")) return;
  lastTurnsSig = sig;
  // turn list, newest default collapsed; click a turn header to expand its items
  const sess = state ? state.session : "";
  const cur = sessionTurns[sessionTurns.length-1] || {};
  const lastTime = cur.time ? hhmm(cur.time) : "";
  let html = `<div class="conv-head">
      <span class="ch-dot"></span>
      <span class="ch-agent">${esc(state.agent||"pi")}</span>
      <span class="ch-sep">/</span>
      <span class="ch-model">${esc(state.model||"")}</span>
      <span class="ch-sep">·</span>
      <span class="ch-sess">会话 <b>${esc(shortId(sess))}</b></span>
      <span class="ch-sep">·</span>
      <span class="ch-meta">${sessionTurns.length} 轮${lastTime?" · 最后 "+lastTime:""}</span>
      <span style="flex:1"></span>
      <div class="msg-tools"><button id="expandall">全部展开</button><button id="collapseall">全部折叠</button></div>
    </div>`;
  let curDay = null;
  for(const turn of sessionTurns){
    const d = dayOf(turn.time);
    if(d !== curDay){ curDay = d; html += `<div class="day"><span class="line"></span><span class="d">${esc(d)}</span><span class="line"></span></div>`; }
    const isOpen = openTurn === turn.index;
    html += `<div class="turn${isOpen?" open":""}" data-turn="${turn.index}">
      <div class="turn-hd">
        <span class="chev">${isOpen?"▾":"▸"}</span>
        <span class="turn-t">第 ${turn.index} 轮</span>
        <span class="turn-time">${hhmm(turn.time)}</span>
        <span style="flex:1"></span>
        <span class="turn-tok">${fmtK(turn.tokens)}</span>
      </div>
      <div class="turn-body" style="display:${isOpen?"block":"none"}">
        ${turn.items.map(itemHtml).join("")}
      </div>
    </div>`;
  }
  el.innerHTML = html;
  // click a turn header to toggle
  el.querySelectorAll(".turn-hd").forEach(hd=>{
    hd.onclick = (ev) => {
      if(ev.target.closest(".copy")) return;
      const turn = hd.parentElement; const idx = Number(turn.dataset.turn);
      openTurn = (openTurn===idx) ? -1 : idx;
      // keep the clicked turn at the same viewport spot: expanding/collapsing
      // changes heights above it, so remember its offset within the viewport
      // (docY - scrollY) and restore that after re-rendering.
      const viewportOffset = hd.getBoundingClientRect().top;   // where it sits now
      const docBefore = window.scrollY + viewportOffset;
      renderConv();
      const hd2 = el.querySelector(`.turn[data-turn="${idx}"] .turn-hd`);
      if(hd2){
        const docAfter = window.scrollY + hd2.getBoundingClientRect().top;
        // move so hd2 sits at the same viewportOffset as before (clamped ≥0)
        window.scrollTo(0, Math.max(0, docAfter - Math.max(viewportOffset, 0)));
      }
    };
  });
  // copy buttons
  el.querySelectorAll(".copy").forEach(b=>{
    b.onclick = (ev) => {
      ev.stopPropagation();
      const txt = b.getAttribute("data-copy") || "";
      try { navigator.clipboard.writeText(txt); b.textContent="✓"; setTimeout(()=>b.textContent="⧉",900); } catch(e){}
    };
  });
  const ea=$("expandall"), ca=$("collapseall");
  if(ea) ea.onclick=()=>{ openTurn = -2; el.querySelectorAll(".turn").forEach(t=>{ t.classList.add("open"); t.querySelector(".turn-body").style.display="block"; t.querySelector(".chev").textContent="▾"; }); };
  if(ca) ca.onclick=()=>{ openTurn = -1; el.querySelectorAll(".turn").forEach(t=>{ t.classList.remove("open"); t.querySelector(".turn-body").style.display="none"; t.querySelector(".chev").textContent="▸"; }); };
  $("foot").textContent = `点击任一轮次展开/折叠内容`;
  el.classList.add("drawn");
}

function renderRows(s){
  const p=s.prompt; const byKind={}; p.parts.forEach(x=>byKind[x.kind]=x);
  const kinds = filter==="全部" ? PARTS.filter(k=>byKind[k]) : PARTS.filter(k=>LABEL[k]===filter&&byKind[k]);
  let max=1; const all=[];
  for(const k of kinds){ for(const it of (byKind[k].items||[])){ all.push({...it,kind:k}); max=Math.max(max,it.tokens);} }
  all.sort((a,b)=>b.tokens-a.tokens);
  window.__rows = all;
  if(!all.length){ $("rows").innerHTML=`<tr><td class="empty">没有内容</td></tr>`; return; }
  $("rows").innerHTML = all.map((it,idx)=>{
    const col=COLOR[it.kind];
    const name = it.tag==="more" ? `另外 ${it.n} 项` : it.name + (it.n>1&&it.tag!=="turn"?` ×${it.n}`:"");
    const has = (it.text!=null && it.text!=="");
    return `<tr class="row" data-idx="${idx}"><td class="n"><span class="dot" style="background:${col}"></span>${esc(name)}${has?' <span style="color:#5f636d">›</span>':''}</td>
      <td style="width:45%"><div class="bar2"><i style="width:${(it.tokens/max*100).toFixed(1)}%;background:${col}"></i></div></td>
      <td class="v">${fmtK(it.tokens)}</td></tr>`;
  }).join("");
  $("rows").querySelectorAll("tr.row").forEach(tr=>{
    tr.onclick = ()=>{ const it = window.__rows[Number(tr.dataset.idx)]; openItem(it); };
  });
  // deep link: #item-N opens item N (and its containing category tab)
  const mItem = /^#item-(\d+)$/.exec(location.hash||"");
  if(mItem && all.length){ const it = all[Number(mItem[1])]; if(it) openItem(it); }
  $("foot").textContent = `${esc(s.agent||"")} › ${esc(s.session||"")} · 共 ${p.turns} 轮 · 点击任一行查看内容 · 估算口径：ASCII≈4字符/token，CJK≈1字/token，图片≈1600`;
}

// openItem shows one item's content (or a part's item list when it has none).
function openItem(it){
  if(!it) return;
  const col = COLOR[it.kind] || "#666";
  $("modal-dot").style.background = col;
  $("modal-title").textContent = (it.tag==="more" ? `另外 ${it.n} 项` : it.name + (it.n>1&&it.tag!=="turn"?` ×${it.n}`:"")) + "  ·  " + (LABEL[it.kind]||it.kind);
  $("modal-sub").textContent = fmtK(it.tokens) + " token";
  if(it.text!=null && it.text!==""){ showContent(it.text, it.kind, it.truncated); }
  else { showContent("（该类为占用统计，无文本内容）", it.kind, false); }
}

// openPart lists a part's items; clicking one shows its content.
function openPart(s, kind){
  const part = s.prompt.parts.find(x=>x.kind===kind);
  if(!part){ return; }
  $("modal-dot").style.background = COLOR[kind]||"#666";
  $("modal-title").textContent = LABEL[kind] + "  ·  " + part.items.length + " 项";
  $("modal-sub").textContent = fmtK(part.tokens) + " token";
  const list = part.items.map((it,i)=>{
    const nm = it.tag==="more" ? `另外 ${it.n} 项` : it.name + (it.n>1&&it.tag!=="turn"?` ×${it.n}`:"");
    const has = it.text!=null && it.text!=="";
    return `<div class="pi-row" data-i="${i}"><span class="pi-n">${esc(nm)}${has?" ›":""}</span><span class="pi-t">${fmtK(it.tokens)}</span></div>`;
  }).join("");
  const mb = $("modal-body");
  mb.className = "modal-body wrap prose";
  mb.innerHTML = `<div class="pi-list">${list}</div>`;
  $("modal-foot").textContent = "点击某项查看其内容";
  $("modal").classList.add("on");
  mb.querySelectorAll(".pi-row").forEach(r=>{
    r.onclick = ()=>{ const it = part.items[Number(r.dataset.i)];
      if(it.text!=null && it.text!=="") showContent(it.text, kind, it.truncated);
      else showContent("（无文本内容）", kind, false); };
  });
}

// looksJSON reports whether s is a JSON object/array worth pretty-printing.
function looksJSON(s){
  const t=s.trim(); if(!t) return false;
  if(t[0]!=="{" && t[0]!=="[") return false;
  try{ JSON.parse(t); return true; }catch(e){ return false; }
}

// highlightJSON colours a pretty-printed JSON string.
function highlightJSON(s){
  // escape only < & > so quotes stay matchable for tokenizing
  const e = s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return e
    .replace(/("(?:\\.|[^"\\])*")(\s*:)/g,'<span class="v-key">$1</span>$2')
    .replace(/:\s*("(?:\\.|[^"\\])*")/g,': <span class="v-str">$1</span>')
    .replace(/:\s*(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,': <span class="v-num">$1</span>')
    .replace(/:\s*(true|false|null)\b/g,': <span class="v-nil">$1</span>');
}

// withLineNumbers renders code line by line with a gutter.
function withLineNumbers(code){
  const lines = code.split("\n");
  return lines.map((ln,i)=>`<div class="v-line"><span class="v-ln">${i+1}</span><span class="v-code">${ln===""?"":esc(ln)}</span></div>`).join("");
}

// renderProse makes a tool description / instruction block readable:
// <section> headers and "- attr: value" bullets get structure.
function renderProse(text){
  const lines = text.split("\n");
  return lines.map(ln=>{
    let esc_ = esc(ln);
    // <xxx> section headers
    const sec = /^\s*<([^>\s]+)>\s*$/.exec(ln);
    if(sec){ return `<div class="v-sec">〈${esc(sec[1])}〉</div>`; }
    // "- name: rest"  or  "- name"
    const bul = /^(\s*)-\s+([A-Za-z_][\w.]*)\s*:?\s*(.*)$/.exec(ln);
    if(bul){
      const indent = bul[1].replace(/\t/g,"  ");
      const key = esc(bul[2]); const rest = esc(bul[3]);
      return `<div class="v-bullet">${indent}• <span class="v-key">${key}</span>${rest?": "+rest:""}</div>`;
    }
    if(ln.trim()==="") return '<div style="height:8px"></div>';
    return `<div>${esc_}</div>`;
  }).join("");
}

// showContent renders a content body by its apparent kind, clearly readable.
function showContent(text, kind, truncated){
  const mb = $("modal-body");
  const note = truncated ? '<div class="v-dim" style="margin-top:12px">…(内容已截断)</div>' : "";
  const bodyKind = kind || "";
  if(looksJSON(text)){
    const pretty = JSON.stringify(JSON.parse(text), null, 2);
    mb.className = "modal-body wrap";
    mb.innerHTML = `<div class="v-code" style="white-space:inherit">${highlightJSON(pretty)}</div>` + note;
    $("modal-foot").textContent = "JSON · 可复制";
  } else if(bodyKind==="tools" || bodyKind==="system" || bodyKind==="memory"){
    mb.className = "modal-body wrap prose";
    mb.innerHTML = renderProse(text) + note;
    $("modal-foot").textContent = "说明文本 · 点「↩ 换行」切换换行";
  } else {
    // source / output: monospace + line numbers, wraps by default
    mb.className = "modal-body wrap filetxt";
    mb.innerHTML = withLineNumbers(text) + note;
    $("modal-foot").textContent = "文本/源码 · 点「↩ 换行」切换";
  }
  $("modal").classList.add("on");
}

// modal controls
(function(){
  const close = ()=>$("modal").classList.remove("on");
  $("modal-close").onclick = close;
  $("modal").addEventListener("click", (e)=>{ if(e.target===$("modal")) close(); });
  document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") close(); });
  $("modal-copy").onclick = ()=>{
    const t = $("modal-body").innerText || "";
    try{ navigator.clipboard.writeText(t); $("modal-copy").textContent="✓"; setTimeout(()=>$("modal-copy").textContent="⧉",900);}catch(e){}
  };
  $("modal-wrap").onclick = ()=>{
    const mb = $("modal-body");
    const wrap = !mb.classList.contains("nowrap");
    mb.classList.toggle("wrap", !wrap);
    mb.classList.toggle("nowrap", wrap);
    $("modal-wrap").textContent = wrap ? "↪ 不换行" : "↩ 换行";
  };
})();

load();
setInterval(load, 4000);
</script>
